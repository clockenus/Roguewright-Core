plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "roguewright" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}


repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Ladysnake Mods"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven { url 'https://repo.sleeping.town/' }
    maven { url 'https://maven.quiltmc.org/repository/release' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation "maven.modrinth:starter-kit:${project.starter_kit_version}"
    modImplementation "maven.modrinth:collective:${project.collective_version}"

    modImplementation "maven.modrinth:melancholic_hunger:${project.melancholic_hunger_version}"
    modImplementation "maven.modrinth:yacl:${project.yacl_version}"

    modImplementation "maven.modrinth:stagger:${project.stagger_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cc_api_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cc_api_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-scoreboard:${project.cc_api_version}"
    implementation include("folk.sisby:kaleido-config:${project.kaleido_config_version}")
    modImplementation "org.quiltmc.parsers:gson:${project.gson_version}"
    modImplementation "org.quiltmc.parsers:json:${project.json_version}"

    modImplementation "maven.modrinth:mclegoman-perspective:${project.perspective_version}"
    modImplementation "maven.modrinth:luminance:${project.luminance_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version

    inputs.property "starter_kit_version", project.starter_kit_version
    inputs.property "collective_version", project.collective_version

    inputs.property "melancholic_hunger_version", project.melancholic_hunger_version
    inputs.property "yacl_version", project.yacl_version

    inputs.property "stagger_version", project.stagger_version
    inputs.property "cc_api_version", project.cc_api_version
    inputs.property "kaleido_config_version", project.kaleido_config_version
    inputs.property "gson_version", project.gson_version
    inputs.property "json_version", project.json_version

    inputs.property "perspective_version", project.perspective_version
    inputs.property "luminance_version", project.luminance_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}
